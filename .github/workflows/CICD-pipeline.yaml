name: Build and push docker image.

on:
  push:
    branches: [ 1st-branch ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4 

    # Log into Docker Hub using GitHub secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Build, tag, and push to Docker Hub
    - name: Docker build and push
      env:
        # Replace 'your-dockerhub-username' with your actual username if you don't use env variables
        DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        REPOSITORY: movie-frontend
        IMAGE_TAG: v${{ github.run_number }}
      run: | 
        docker build -t $DOCKER_USER/$REPOSITORY:$IMAGE_TAG .
        docker build -t $DOCKER_USER/$REPOSITORY:latest .
        
        docker push $DOCKER_USER/$REPOSITORY:$IMAGE_TAG
        docker push $DOCKER_USER/$REPOSITORY:latest
